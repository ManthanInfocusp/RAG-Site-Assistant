[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG site assistant backend (api, chat-server, worker)"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    # Data
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # Background
    "celery[redis]>=5.4",
    "redis>=5.2",
    # Object store
    "boto3>=1.35",
    # Crawler / parsing
    "httpx>=0.28",
    "playwright>=1.49",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
    "pypdf>=5.1",
    "python-docx>=1.1",
    # RAG
    "sentence-transformers>=3.3",
    "tiktoken>=0.8",
    # LLM providers
    "openai>=1.59",
    "google-genai>=1.0",
    # Auth / security
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    # Observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
]

[project.scripts]
rag-cli = "app.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

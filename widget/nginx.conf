server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /chat.js {
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*";
    try_files /chat.js =404;
  }

  location / {
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
}

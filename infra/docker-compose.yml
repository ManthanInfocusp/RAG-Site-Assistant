name: rag-site-assistant

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS:-http://portal.localhost:8081,http://portal.localhost,http://localhost:5173}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb -p local/${S3_BUCKET:-rag-uploads} || true &&
      echo 'MinIO bucket ready'
      "

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: rag-backend:dev
    command: ["api"]
    env_file: ../.env
    environment:
      SERVICE_NAME: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.localhost`)
      - traefik.http.services.api.loadbalancer.server.port=8000

  chat-server:
    image: rag-backend:dev
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["chat"]
    env_file: ../.env
    environment:
      SERVICE_NAME: chat-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.chat.rule=Host(`chat.localhost`)
      - traefik.http.services.chat.loadbalancer.server.port=8001

  worker:
    image: rag-backend:dev
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["worker"]
    env_file: ../.env
    environment:
      SERVICE_NAME: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  portal:
    build:
      context: ../portal
      dockerfile: Dockerfile
    image: rag-portal:dev
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.http.routers.portal.rule=Host(`portal.localhost`)
      - traefik.http.services.portal.loadbalancer.server.port=80

  widget:
    build:
      context: ../widget
      dockerfile: Dockerfile
    image: rag-widget:dev
    labels:
      - traefik.enable=true
      - traefik.http.routers.widget.rule=Host(`cdn.localhost`)
      - traefik.http.services.widget.loadbalancer.server.port=80

  traefik:
    image: traefik:v3.6
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "8081:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
